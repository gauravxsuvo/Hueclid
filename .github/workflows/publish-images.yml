name: Publish images

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/hueclid-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/hueclid-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # NEXT_PUBLIC_API_BASE_URL gets baked into the client bundle at build
      # time, so this published image is specifically the frontend for the
      # hosted instance at hueclid.cinexg.com, not a generic template. Self
      # hosting against a different backend means building your own image
      # with your own value here, same as the Portway deploy does.
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://hueclid-api.cinexg.com
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Portway redeploys off its own webhook on this same push (see the repo's
  # webhook settings -- panel.cinexg.com/api/hooks/github/{hueclid,hueclid-api},
  # subscribed to `push` only), independently of anything in this workflow.
  # That webhook has no way to write back to GitHub's Deployments API, so
  # without this job the Deployments panel goes stale after the first
  # manually-recorded entry while the site keeps redeploying underneath it.
  # Only on `push`, not `release`: a release publish doesn't cause a new
  # Portway redeploy (the webhook only fires on push), so recording one
  # here would claim a deploy that didn't happen.
  record-deployment:
    needs: [backend, frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "production",
              auto_merge: false,
              required_contexts: [],
              description: "Images published to GHCR; Portway redeploys via its own webhook.",
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: "success",
              description: "Deployed",
              environment_url: "https://hueclid.cinexg.com",
            });

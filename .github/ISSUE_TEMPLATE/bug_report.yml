name: Bug report
description: Something isn't working the way it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the backend with ...
        2. Upload an image with ...
        3. See error ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Where does this happen?
      options:
        - Backend (FastAPI / color math / clustering)
        - Frontend (Next.js)
        - Both / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Which commit, tag, or branch are you on?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
    validations:
      required: false
